{% extends 'base.html' %}

{% block content %}

{% load crispy_forms_tags %}
<h3 class="text-center">Login</h3>
<form action="{% url 'login' %}" method="POST" style="width: 400px; margin:auto;" class="mb-3">
    {% csrf_token %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary d-block mx-auto">Login</button>
</form>

{% endblock %}
