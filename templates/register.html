{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<h3 class="text-center">Register</h3>
<form action="{% url 'register' %}" method="POST" style="width:500px; margin:auto;" class="mb-3">
    {%  csrf_token  %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary d-block text-center mx-auto">Register</button>
</form>

{% if messages %}
    <script>
        {% for i in messages %}
        alert("{{ i }}")
        {% endfor %}
    </script>
{% endif %}

{% endblock %}
