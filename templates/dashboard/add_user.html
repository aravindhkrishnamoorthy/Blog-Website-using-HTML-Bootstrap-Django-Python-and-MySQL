{% extends "base.html" %}

{% block content %}
{% load crispy_forms_tags %}
<div class="row">
    <!--left sidebar-->
    <!--sidebar here-->
    {% include "dashboard/sidebar.html" %}

    <div class="col-md-9">
        {% if perms.auth.view_user %}
        <h3 class="">Add New User</h3>
        <form action="{% url 'add_user' %}" method="POST" style="width: 600px;" >
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-danger">Submit</button>
        </form>
        {% else %}
        <h5>You do not have permissions to view this page</h5>
        {% endif %}
    </div>
</div>
{% endblock %}
