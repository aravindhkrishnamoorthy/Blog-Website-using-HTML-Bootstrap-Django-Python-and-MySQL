{% extends 'base.html' %}

{% block content %}

<div class="row mt-4">
    <!-- left sidebar -->
    <!-- sidebar here -->
    {% include 'dashboard/sidebar.html' %}

    <!-- right sidebar -->
    <div class="col-md-9">
        <h3 class="pb-2 d-inline">All Categories</h3>
        <span>
            <a href="{% url 'add_category' %}" class="btn btn-dark text-light float-end mb-2">Add New</a>
        </span>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th scope="col">Si.No</th>
                    <th scope="col">Category Name</th>
                    <th scope="col">Created at</th>
                    <th scope="col">Updated at</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for i in categories %}
                <tr>
                    <td scope="row">{{ forloop.counter }}</td>
                    <td>{{ i.category_name }}</td>
                    <td>{{ i.created_at }}</td>
                    <td>{{ i.updated_at }}</td>
                    <td>
                        <a href="{% url 'edit_category' i.id %}" class="text-decoration-none">
                            <i class="fa fa-edit text-primary"></i>
                        </a>
                        &nbsp; &nbsp;
                        <a href="{% url 'delete_category' i.id %}">
                            <i class="fa fa-trash text-danger"></i>
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
    </div>
</div>

{% endblock %}
