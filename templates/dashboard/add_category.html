{% extends "base.html" %}

{% block content %}
{% load crispy_forms_tags %}
<div class="row">
    <!--left sidebar-->
    <!--sidebar here-->
    {% include "dashboard/sidebar.html" %}

    <div class="col-md-9">
        <h3 class="">Add New Category</h3>
        <form action="{% url 'add_category' %}" method="POST" style="width: 300px;" >
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-danger">Submit</button>
        </form>
    </div>
</div>
{% endblock %}
